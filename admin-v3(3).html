<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Star Crush Plant - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial;color:#222}.app{max-width:760px;margin:auto;background:#fff;min-height:100vh}
.head{background:#f45100;color:#fff;padding:18px;font-size:20px;font-weight:bold}.box,.order,.product{margin:12px;padding:14px;border:1px solid #ddd;border-radius:9px}.input{width:100%;height:42px;border:1px solid #ccc;border-radius:6px;padding:0 10px;margin:5px 0}.btn{padding:10px 12px;border:0;border-radius:6px;background:#f45100;color:#fff;margin:3px;cursor:pointer}.ok{background:#2e7d32}.reject,.danger{background:#c62828}.blue{background:#1976d2}.status{padding:6px 9px;border-radius:15px;background:#eee;font-size:12px}.pending{background:#ffe0b2}.confirmed{background:#d1ecf1}.rejected{background:#f8d7da}.shipped{background:#d9e7ff}.delivered{background:#d4edda}.product{display:flex;gap:12px;align-items:center}.product img{width:75px;height:65px;object-fit:cover;border-radius:6px;background:#eee}.muted{font-size:12px;color:#666}.actions{margin-top:12px;border-top:1px solid #eee;padding-top:10px}.login{max-width:420px;margin:60px auto}
</style></head><body><div class="app"><div class="head">★ Three Star Crush Plant — ADMIN</div>
<div id="login" class="login box"><h2>Admin Login</h2><input id="pw" class="input" type="password" placeholder="Admin Password"><button class="btn" onclick="login()">Sign In</button><p class="muted">Demo password: <b>1122</b></p></div>
<div id="panel" style="display:none"><div class="box"><b id="count">0 Total Orders</b></div>
<div class="box"><h2>Products Management</h2><input id="pName" class="input" placeholder="Product name"><input id="pPrice" class="input" type="number" placeholder="Price"><textarea id="pDesc" class="input" style="height:70px;padding-top:10px" placeholder="Product description"></textarea><input id="pPhoto" class="input" type="file" accept="image/*"><button class="btn" onclick="addProduct()">+ Add Product</button></div>
<div id="products"></div>
<div class="box"><h2>Orders Management</h2><div class="muted">Complete customer and order information is shown below.</div></div><div id="orders"></div>
</div></div>
<script>
const P="tsp_products",O="tsp_orders";
let products=JSON.parse(localStorage.getItem(P)||"[]"),orders=JSON.parse(localStorage.getItem(O)||"[]");
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function login(){if(pw.value==="1122"){document.getElementById("login").style.display="none";document.getElementById("panel").style.display="block";draw()}else alert("Wrong password")}
function saveProducts(){localStorage.setItem(P,JSON.stringify(products))}
function saveOrders(){localStorage.setItem(O,JSON.stringify(orders))}
function addProduct(){
 let name=pName.value.trim(),price=Number(pPrice.value),desc=pDesc.value.trim(),file=pPhoto.files[0];
 if(!name||!price)return alert("Enter product name and price");
 const finish=image=>{products.push({id:Date.now(),name,price,desc,image:image||"",emoji:"🪨"});saveProducts();pName.value=pPrice.value=pDesc.value="";pPhoto.value="";drawProducts();alert("Product added")};
 if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish("");
}
function deleteProduct(id){let p=products.find(x=>x.id===id);if(p&&confirm("Delete this product?")){products=products.filter(x=>x.id!==id);saveProducts();drawProducts()}}
function drawProducts(){
 document.getElementById("products").innerHTML=products.map(p=>`<div class="product">${p.image?`<img src="${p.image}">`:`<img alt="🪨">`}<div style="flex:1"><b>${esc(p.name)}</b><br><b>Rs ${Number(p.price).toLocaleString()}</b><br><span class="muted">${esc(p.desc||"")}</span></div><button class="btn danger" onclick="deleteProduct(${p.id})">🗑 Delete</button></div>`).join("")||'<div class="box">No products.</div>';
}
function setStatus(id,status){let o=orders.find(x=>x.id===id);if(o){o.status=status;o.statusTime=new Date().toLocaleString();saveOrders();drawOrders()}}
function deleteOrder(id){if(confirm("Delete this order? This cannot be undone.")){orders=orders.filter(x=>x.id!==id);saveOrders();drawOrders()}}
function drawOrders(){
 orders=JSON.parse(localStorage.getItem(O)||"[]");document.getElementById("count").textContent=orders.length+" Total Orders";
 document.getElementById("orders").innerHTML=orders.slice().reverse().map(o=>`<div class="order">
 <b>Order ID: ${esc(o.id)}</b> <span class="status ${String(o.status||"Pending").toLowerCase()}">${esc(o.status||"Pending")}</span>
 <p class="muted">Date & Time: ${esc(o.date)}${o.statusTime?`<br>Status changed: ${esc(o.statusTime)}`:""}</p><hr>
 <h3>Customer Details</h3>
 <b>Name:</b> ${esc(o.customer?.name)}<br><b>Phone:</b> ${esc(o.customer?.phone)}<br><b>Email:</b> ${esc(o.customer?.email||"Not provided")}<br><b>Delivery Address:</b> ${esc(o.customer?.address)}<br>
 <h3>Order Details</h3>${(o.items||[]).map(i=>`• ${esc(i.name)} — Qty: ${i.quantity||1} — Rs ${Number(i.price).toLocaleString()}`).join("<br>")}
 <hr><b>Total Amount: Rs ${Number(o.total||0).toLocaleString()}</b>
 <div class="actions"><b>Change Order Status:</b><br>
 <button class="btn ok" onclick="setStatus('${o.id}','Confirmed')">✓ Confirm Order</button>
 <button class="btn reject" onclick="setStatus('${o.id}','Rejected')">✕ Reject Order</button>
 <button class="btn blue" onclick="setStatus('${o.id}','Shipped')">🚚 Shipped</button>
 <button class="btn ok" onclick="setStatus('${o.id}','Delivered')">✓ Delivered</button>
 <button class="btn danger" onclick="deleteOrder('${o.id}')">🗑 Delete Order</button></div>
 </div>`).join("")||'<div class="box">No customer orders yet.</div>';
}
function draw(){products=JSON.parse(localStorage.getItem(P)||"[]");drawProducts();drawOrders()}
setInterval(()=>{if(document.getElementById("panel").style.display!=="none")draw()},1500);
</script></body><script type="module">

</script></html>
